<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FF IND Auto-Liker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ff: {
              dark: '#0f1117',
              card: '#1a1d29',
              border: '#2a2f3f',
            },
          },
        },
      },
    };
  </script>
  <style>
    .terminal-scroll::-webkit-scrollbar { width: 6px; }
    .terminal-scroll::-webkit-scrollbar-track { background: #1e2130; }
    .terminal-scroll::-webkit-scrollbar-thumb { background: #3b4252; border-radius: 3px; }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 8px rgba(251,191,36,0.3); }
      50% { box-shadow: 0 0 20px rgba(251,191,36,0.6); }
    }
    .glow-amber { animation: pulse-glow 2s infinite; }
  </style>
</head>
<body class="bg-ff-dark text-gray-200 min-h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-ff-border bg-ff-card/70 backdrop-blur sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center text-xl font-bold text-white shadow-lg">
        FF
      </div>
      <div>
        <h1 class="text-lg font-bold text-white leading-tight">Free Fire IND · Auto-Liker</h1>
        <p class="text-xs text-gray-400">Send likes to any player UID on the India server</p>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">

    <!-- ─── Form Card ─── -->
    <section class="bg-ff-card rounded-2xl border border-ff-border p-6 shadow-xl">
      <h2 class="text-sm font-semibold text-amber-400 uppercase tracking-wider mb-4">⚙️ Configuration</h2>

      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5">Target UID</label>
          <input id="uidInput" type="text" inputmode="numeric" placeholder="e.g. 2216160076"
            class="w-full bg-ff-dark border border-ff-border rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-gray-600
                   focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5">Session Key <span class="text-gray-600">(optional for mock)</span></label>
          <input id="sessionInput" type="text" placeholder="Your Free Fire JWT / session"
            class="w-full bg-ff-dark border border-ff-border rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-gray-600
                   focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition" />
        </div>
      </div>

      <button id="likeBtn" onclick="sendLike()"
        class="mt-5 w-full sm:w-auto px-8 py-3 rounded-lg font-semibold text-sm text-black
               bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400
               active:scale-[0.98] transition shadow-lg shadow-amber-500/20 disabled:opacity-50 disabled:cursor-not-allowed">
        🔥 Send Likes
      </button>
    </section>

    <!-- ─── Amber Info Box (hidden by default) ─── -->
    <section id="infoBox" class="hidden glow-amber bg-gradient-to-br from-amber-500/15 to-yellow-600/10 border-2 border-amber-500/50 rounded-2xl p-5">
      <div class="flex items-start gap-4">
        <div class="w-12 h-12 rounded-xl bg-amber-500/20 flex items-center justify-center text-2xl shrink-0">📊</div>
        <div class="flex-1 min-w-0">
          <h3 class="text-amber-300 font-bold text-sm uppercase tracking-wide mb-1">Like Report</h3>
          <p id="infoPlayerName" class="text-white font-semibold text-lg truncate"></p>
          <div class="mt-3 grid grid-cols-3 gap-3 text-center">
            <div class="bg-black/20 rounded-lg py-2 px-1">
              <p class="text-[10px] text-gray-400 uppercase tracking-wider">Old Likes</p>
              <p id="infoOldLikes" class="text-xl font-bold text-gray-300">—</p>
            </div>
            <div class="bg-black/20 rounded-lg py-2 px-1">
              <p class="text-[10px] text-gray-400 uppercase tracking-wider">New Likes</p>
              <p id="infoNewLikes" class="text-xl font-bold text-amber-300">—</p>
            </div>
            <div class="bg-black/20 rounded-lg py-2 px-1">
              <p class="text-[10px] text-gray-400 uppercase tracking-wider">Gained</p>
              <p id="infoGained" class="text-xl font-bold text-green-400">—</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ─── Terminal Log ─── -->
    <section class="bg-ff-card rounded-2xl border border-ff-border shadow-xl overflow-hidden">
      <div class="flex items-center gap-2 px-4 py-3 border-b border-ff-border bg-black/20">
        <span class="w-3 h-3 rounded-full bg-red-500/80"></span>
        <span class="w-3 h-3 rounded-full bg-yellow-500/80"></span>
        <span class="w-3 h-3 rounded-full bg-green-500/80"></span>
        <span class="ml-2 text-xs text-gray-500 font-mono">terminal</span>
      </div>
      <div id="terminal" class="terminal-scroll h-64 overflow-y-auto p-4 font-mono text-xs leading-relaxed bg-[#0d0f16]">
        <div class="text-gray-500">[system] FF IND Auto-Liker ready.</div>
      </div>
    </section>

  </main>

  <footer class="max-w-4xl mx-auto px-4 pb-8 text-center text-[11px] text-gray-600">
    For educational purposes only. Respect Garena's Terms of Service.
  </footer>

  <script>
    // ── Terminal logger ──
    const term = document.getElementById('terminal');
    function log(msg, type = 'info') {
      const colors = {
        info:    'text-gray-300',
        success: 'text-green-400',
        error:   'text-red-400',
        warn:    'text-amber-400',
        system:  'text-cyan-400',
      };
      const time = new Date().toLocaleTimeString('en-IN', { hour12: false });
      const line = document.createElement('div');
      line.className = colors[type] || colors.info;
      line.textContent = `[${time}] ${msg}`;
      term.appendChild(line);
      term.scrollTop = term.scrollHeight;
    }

    // ── Main action ──
    async function sendLike() {
      const uidInput     = document.getElementById('uidInput');
      const sessionInput = document.getElementById('sessionInput');
      const btn          = document.getElementById('likeBtn');
      const uid          = uidInput.value.trim();
      const sessionKey   = sessionInput.value.trim();

      if (!uid) {
        log('❌ Target UID is required.', 'error');
        uidInput.focus();
        return;
      }

      // Lock UI
      btn.disabled = true;
      btn.textContent = '⏳ Sending…';
      document.getElementById('infoBox').classList.add('hidden');

      log(`▶ Target UID: ${uid}`, 'system');
      if (sessionKey) log('🔑 Session key provided.', 'info');
      log('📡 Fetching player info from API…', 'info');

      try {
        const res = await fetch('/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid, session_key: sessionKey }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || `HTTP ${res.status}`);
        }

        // ── Success path ──
        log(`✅ Player found: ${data.player_name}`, 'success');
        log(`📊 Old likes: ${data.old_likes}`, 'info');

        if (data.success) {
          log(`🔥 Like sent successfully!`, 'success');
          log(`📈 New likes: ${data.new_likes} (+${data.likes_gained})`, 'success');
        } else {
          log(`⚠️ Like request was rejected by the server.`, 'warn');
          if (data.error) log(`   ↳ ${data.error}`, 'warn');
          log(`📈 Likes remain: ${data.new_likes}`, 'info');
        }

        // ── Populate amber info box ──
        document.getElementById('infoPlayerName').textContent = data.player_name;
        document.getElementById('infoOldLikes').textContent   = data.old_likes;
        document.getElementById('infoNewLikes').textContent   = data.new_likes;
        document.getElementById('infoGained').textContent     = `+${data.likes_gained}`;
        document.getElementById('infoBox').classList.remove('hidden');

      } catch (err) {
        log(`❌ Error: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '🔥 Send Likes';
      }
    }

    // Allow Enter key in UID field
    document.getElementById('uidInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendLike();
    });
  </script>
</body>
        </html>
